<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RabbitEngine 프롬프트 편집기</title>
  <style>
    body{margin:0;background:#f4f6f8;color:#18212b;font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h2{margin:0}.help{color:#526171}[hidden]{display:none!important}.screen-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}.screen-heading p{margin:4px 0 0}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0;padding:10px 0;background:#f4f6f8;border-bottom:1px solid #d4dce4}.name-field{display:flex;align-items:center;gap:8px;flex:1 1 260px;max-width:420px;color:#526171;font-size:14px}.name-field input{flex:1;min-width:0}.name-field input[readonly]{border-color:transparent;background:transparent;color:#18212b;font-weight:600}.toolbar-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar-end{display:flex;gap:8px;align-items:center;margin-left:auto}.ghost{background:transparent;border-color:#c5ced8}.ghost:hover:not(:disabled){background:white}.danger{color:#a11a24;border-color:#e3a1a7}.menu-wrap{position:relative}.more-button{width:40px;height:40px;padding:0;font-size:20px;line-height:1;display:inline-grid;place-items:center}.more-button[aria-expanded=true]{background:white;border-color:#8795a4}.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;display:grid;min-width:180px;padding:6px;background:white;border:1px solid #d4dce4;border-radius:10px;box-shadow:0 10px 30px rgba(15,25,40,.16)}.menu [role=menuitem]{border:0;border-radius:6px;background:none;padding:8px 10px;text-align:left;font-size:14px}.menu [role=menuitem]:hover,.menu [role=menuitem]:focus-visible{background:#f1f5fb;outline:none}.menu .danger{color:#a11a24}.menu-separator{height:1px;margin:4px 2px;background:#e3e8ee}.dirty{font-size:13px;color:#8a4b00;background:#fff3df;border-radius:999px;padding:2px 10px}label{display:grid;gap:4px}button,input{font:inherit;border:1px solid #8795a4;border-radius:5px;padding:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#245dbd;border-color:#245dbd;color:white;font-weight:600;min-width:72px}.profile-list{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}.profile-list>li{display:flex}.profile-item{flex:1;min-height:136px;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid #d4dce4;border-radius:8px}.profile-item:hover{border-color:#3874e5;background:#f5f8ff}.profile-name{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.profile-meta{color:#526171;font-size:13px;line-height:1.5}.profile-open{margin-top:auto;color:#245dbd;font-size:14px}.profile-add{align-items:center;justify-content:center;gap:4px;text-align:center;border:1.5px dashed #8795a4;background:transparent;color:#245dbd}.profile-add-icon{font-size:40px;line-height:1;font-weight:300}.sheet{margin:auto auto 0;width:min(480px,100%);max-width:100%;padding:0;border:0;border-radius:16px 16px 0 0;background:white;color:inherit;box-shadow:0 -8px 32px rgba(0,0,0,.2)}.sheet[open]{animation:sheet-up .2s ease-out}.sheet::backdrop{background:rgba(0,0,0,.45)}@keyframes sheet-up{from{transform:translateY(100%)}}.sheet-body{display:grid;gap:10px;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}.sheet h2{font-size:17px;margin:0 0 4px}.sheet-option{display:grid;gap:2px;text-align:left;padding:14px 16px;border:1px solid #d4dce4;border-radius:10px}.sheet-option:hover{border-color:#3874e5;background:#f5f8ff}.sheet-option-title{font-weight:600}.sheet-option-help{color:#526171;font-size:13px}.sheet-cancel{margin-top:4px;padding:12px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.tabs{display:flex;gap:24px;border-bottom:1px solid #d4dce4}.tabs [role=tab]{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 2px;margin-bottom:-1px;color:#526171;font-weight:600}.tabs [role=tab]:hover{color:#18212b}.tabs [role=tab][aria-selected=true]{color:#245dbd;border-bottom-color:#245dbd}.spec{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start;margin-top:24px}.spec-toc{position:sticky;top:16px}.spec-toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}.spec-toc a{display:block;padding:6px 10px;border-radius:6px;color:#18212b;text-decoration:none;font-size:14px}.spec-toc a:hover{background:#e8eef7}.spec-body{display:grid;gap:16px;min-width:0}.spec-section{background:white;border:1px solid #d4dce4;border-radius:8px;padding:20px 24px;min-width:0;scroll-margin-top:16px}.spec-section h2{font-size:20px;margin-bottom:12px}.spec-section h3{font-size:16px;margin:18px 0 8px}.spec-section p,.spec-section ul{margin:8px 0}.spec-section li+li{margin-top:4px}.spec code{font:13px ui-monospace,monospace;background:#f3f5f8;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}.spec pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px/1.6 ui-monospace,monospace;background:#f3f5f8;padding:12px;border-radius:6px;margin:8px 0;max-height:420px;overflow:auto}.spec-table{overflow-x:auto;margin:10px 0}.spec table{border-collapse:collapse;width:100%;font-size:14px}.spec th,.spec td{border-bottom:1px solid #e3e8ee;padding:8px 10px;text-align:left;vertical-align:top}.spec th{color:#526171;font-weight:600;white-space:nowrap}.spec-blocks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));margin-top:12px}.spec-block{border:1px solid #d4dce4;border-radius:8px;padding:14px 16px;min-width:0;scroll-margin-top:16px}.spec-block h3{margin:0 0 6px;font-size:16px}.spec-block dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:14px}.spec-block dt{color:#526171}.spec-block dd{margin:0;min-width:0}.spec-badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.spec-badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#eef1f5;color:#384656}.spec-badge-slot{background:#e7efff;color:#1d4fa8}.spec-badge-warn{background:#fff3df;color:#8a4b00}.spec details{margin:10px 0}.spec summary{cursor:pointer;color:#245dbd;padding:4px 0}.spec-muted{color:#526171;font-size:14px}.spec-flow{padding-left:22px;margin:8px 0}.spec-flow li+li{margin-top:8px}.spec-flow .spec-badge{margin-right:6px}.spec-order{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}.spec-order li{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:12px;padding:8px 12px;border:1px solid #e3e8ee;border-radius:6px;background:#fafbfc}.spec-where{color:#526171;font-size:13px}.spec-order a{color:#245dbd}.spec td code{overflow-wrap:normal}.spec-messages{padding-left:22px}.spec-role{font:12px ui-monospace,monospace;color:#526171}@media(max-width:900px){.spec{grid-template-columns:1fr}.spec-toc{position:static}.spec-toc ol{display:flex;flex-wrap:wrap;gap:6px}.spec-toc a{border:1px solid #d4dce4;background:white;padding:4px 10px;font-size:13px}}@media(max-width:600px){.spec-section{padding:16px}.spec-order li{grid-template-columns:1fr;gap:2px}}@media(prefers-reduced-motion:reduce){.sheet[open]{animation:none}}.back{border:0;background:none;padding:0;color:#245dbd}#edit-view:focus{outline:none}:focus-visible{outline:3px solid #3874e5;outline-offset:2px}@media(max-width:600px){main{padding:16px}.screen-heading{align-items:stretch;flex-direction:column}.toolbar-end{margin-left:0}.menu{left:0;right:auto}.name-field{max-width:none}.profile-item{padding:14px}}
  </style>
</head>
<body>
<main>
  <div class="tabs" role="tablist" aria-label="편집기 화면">
    <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="true">프롬프트 설정</button>
    <button type="button" role="tab" id="tab-spec" aria-controls="panel-spec" aria-selected="false" tabindex="-1">엔진 스펙</button>
  </div>
  <div id="panel-settings" role="tabpanel" aria-labelledby="tab-settings">
  <section id="list-view" aria-labelledby="list-title">
    <div class="screen-heading">
      <div><h2 id="list-title" tabindex="-1">등록된 설정</h2><p class="help">설정을 선택해 시스템 프롬프트와 태그를 편집합니다.</p></div>
    </div>
    <ul id="profiles" class="profile-list"></ul>
    <input id="import" class="visually-hidden" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">
  </section>
  <dialog id="add-sheet" class="sheet" aria-labelledby="add-sheet-title">
    <div class="sheet-body">
      <h2 id="add-sheet-title">설정 추가</h2>
      <button type="button" id="new" class="sheet-option"><span class="sheet-option-title">새 설정</span><span class="sheet-option-help">기본값으로 시작합니다. 저장하면 목록에 추가됩니다.</span></button>
      <button type="button" id="import-start" class="sheet-option"><span class="sheet-option-title">JSON 가져오기</span><span class="sheet-option-help">내보낸 설정 파일(.json)을 불러와 목록에 추가합니다.</span></button>
      <button type="button" id="sheet-cancel" class="sheet-cancel">취소</button>
    </div>
  </dialog>
  <!-- 화면 이름(설정 이름 · 수정 · 만들기)은 제목을 따로 두지 않고 aria-label 로 읽힌다. 열 때 이 구역으로 초점이 온다. -->
  <section id="edit-view" tabindex="-1" hidden>
    <div class="screen-heading"><button type="button" id="back" class="back">← 설정 목록</button></div>
    <div class="toolbar">
      <label class="name-field">이름<input id="name" maxlength="120"></label>
      <div class="toolbar-end">
      <div class="toolbar-group" id="read-actions">
        <button type="button" id="edit" class="primary">수정</button>
      </div>
      <!-- 변경 표시는 버튼 왼쪽에 둔다 — 나타날 때 저장 · 취소 버튼이 밀리지 않게. -->
      <div class="toolbar-group" id="edit-actions" hidden>
        <span id="dirty" class="dirty" role="status" hidden>저장하지 않은 변경</span>
        <button type="button" id="cancel" class="ghost" title="마지막 저장 상태로 돌리고 읽기 모드로 돌아갑니다">취소</button>
        <button type="button" id="save" class="primary" title="이 브라우저에 저장하고 읽기 모드로 돌아갑니다">저장</button>
      </div>
      <div class="toolbar-group" id="more-actions">
        <div class="menu-wrap">
          <button type="button" id="more" class="ghost more-button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu" aria-label="더보기" title="더보기">⋯</button>
          <div id="more-menu" class="menu" role="menu" aria-label="더보기" hidden>
            <button type="button" role="menuitem" id="duplicate" tabindex="-1">복제</button>
            <button type="button" role="menuitem" id="export" tabindex="-1">JSON 내보내기</button>
            <div class="menu-separator" role="separator"></div>
            <button type="button" role="menuitem" id="delete" class="danger" tabindex="-1">삭제</button>
          </div>
        </div>
      </div>
      </div>
    </div>
    <div id="editor"></div>
  </section>
  </div>
  <div id="panel-spec" role="tabpanel" aria-labelledby="tab-spec" hidden></div>
</main>
<script type="module" src="./standalone.js"></script>
</body>
</html>
