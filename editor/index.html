<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RabbitEngine 프롬프트 편집기</title>
  <style>
    body{margin:0;background:#f4f6f8;color:#18212b;font:15px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}h2{margin:0}.help{color:#526171}[hidden]{display:none!important}.screen-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}.screen-heading p{margin:4px 0 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.toolbar{margin:20px 0}label{display:grid;gap:4px}button,input{font:inherit;border:1px solid #8795a4;border-radius:5px;padding:8px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}#save{background:#245dbd;border-color:#245dbd;color:white}.profile-list{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}.profile-list>li{display:flex}.profile-item{flex:1;min-height:136px;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid #d4dce4;border-radius:8px}.profile-item:hover{border-color:#3874e5;background:#f5f8ff}.profile-name{font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.profile-meta{color:#526171;font-size:13px;line-height:1.5}.profile-open{margin-top:auto;color:#245dbd;font-size:14px}.profile-add{align-items:center;justify-content:center;gap:4px;text-align:center;border:1.5px dashed #8795a4;background:transparent;color:#245dbd}.profile-add-icon{font-size:40px;line-height:1;font-weight:300}.sheet{margin:auto auto 0;width:min(480px,100%);max-width:100%;padding:0;border:0;border-radius:16px 16px 0 0;background:white;color:inherit;box-shadow:0 -8px 32px rgba(0,0,0,.2)}.sheet[open]{animation:sheet-up .2s ease-out}.sheet::backdrop{background:rgba(0,0,0,.45)}@keyframes sheet-up{from{transform:translateY(100%)}}.sheet-body{display:grid;gap:10px;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}.sheet h2{font-size:17px;margin:0 0 4px}.sheet-option{display:grid;gap:2px;text-align:left;padding:14px 16px;border:1px solid #d4dce4;border-radius:10px}.sheet-option:hover{border-color:#3874e5;background:#f5f8ff}.sheet-option-title{font-weight:600}.sheet-option-help{color:#526171;font-size:13px}.sheet-cancel{margin-top:4px;padding:12px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}@media(prefers-reduced-motion:reduce){.sheet[open]{animation:none}}.back{border:0;background:none;padding:0;color:#245dbd}:focus-visible{outline:3px solid #3874e5;outline-offset:2px}@media(max-width:600px){main{padding:16px}.screen-heading,.toolbar{align-items:stretch;flex-direction:column}.profile-item{padding:14px}}
  </style>
</head>
<body>
<main>
  <section id="list-view" aria-labelledby="list-title">
    <div class="screen-heading">
      <div><h2 id="list-title" tabindex="-1">등록된 설정</h2><p class="help">설정을 선택해 시스템 프롬프트와 태그를 편집합니다.</p></div>
    </div>
    <ul id="profiles" class="profile-list"></ul>
    <input id="import" class="visually-hidden" type="file" accept="application/json,.json" tabindex="-1" aria-hidden="true">
  </section>
  <dialog id="add-sheet" class="sheet" aria-labelledby="add-sheet-title">
    <div class="sheet-body">
      <h2 id="add-sheet-title">설정 추가</h2>
      <button type="button" id="new" class="sheet-option"><span class="sheet-option-title">새 설정</span><span class="sheet-option-help">기본값으로 시작합니다. 저장하면 목록에 추가됩니다.</span></button>
      <button type="button" id="import-start" class="sheet-option"><span class="sheet-option-title">JSON 가져오기</span><span class="sheet-option-help">내보낸 설정 파일(.json)을 불러와 목록에 추가합니다.</span></button>
      <button type="button" id="sheet-cancel" class="sheet-cancel">취소</button>
    </div>
  </dialog>
  <section id="edit-view" aria-labelledby="edit-title" hidden>
    <div class="screen-heading"><div><button type="button" id="back" class="back">← 설정 목록</button><h2 id="edit-title" tabindex="-1"></h2></div></div>
    <div class="toolbar">
      <label>설정 이름<input id="name" maxlength="120"></label>
      <button type="button" id="save">브라우저에 저장</button>
      <button type="button" id="revert">마지막 저장 상태로 되돌리기</button>
      <button type="button" id="duplicate">복제</button>
      <button type="button" id="delete">삭제</button>
      <button type="button" id="export">JSON 내보내기</button>
    </div>
    <div id="editor"></div>
  </section>
</main>
<script type="module" src="./standalone.js"></script>
</body>
</html>
